name: klik

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-klik}
      POSTGRES_USER: ${POSTGRES_USER:-klik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klik}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5432 на машине часто занят локально установленным постгресом.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-klik} -d ${POSTGRES_DB:-klik}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      # В контейнере база доступна по имени сервиса, а не по localhost из .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-klik}:${POSTGRES_PASSWORD:-klik}@db:5432/${POSTGRES_DB:-klik}
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
